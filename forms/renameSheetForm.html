<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
    select, input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .btn { background-color: #4285f4; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; }
    .btn:hover { background-color: #3367d6; }
    #status { margin-top: 12px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <form id="mainForm">
    <div class="form-group">
      <label for="oldName">Select Sheet:</label>
      <select id="oldName" required>
        <option value="" disabled selected>Loading...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="newName">New Sheet Name:</label>
      <input type="text" id="newName" required placeholder="e.g. Advanced Soft Skills">
    </div>
    <button type="submit" class="btn" id="submitBtn">Rename</button>
    <div id="status"></div>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      google.script.run.withSuccessHandler(function(sheets) {
        var select = document.getElementById('oldName');
        select.innerHTML = '';
        sheets.forEach(function(s) {
          var opt = document.createElement('option'); opt.value = s; opt.text = s; select.appendChild(opt);
        });
      }).getAssessmentSheets();
    });

    document.getElementById('mainForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var status = document.getElementById('status');
      btn.disabled = true; status.textContent = 'Processing...';
      
      google.script.run
        .withSuccessHandler(function(msg) {
          status.style.color = '#0f9d58'; status.textContent = msg;
          setTimeout(function() { google.script.host.close(); }, 2000);
        })
        .withFailureHandler(function(err) {
          status.style.color = 'red'; status.textContent = err.message; btn.disabled = false;
        })
        .renameAssessmentSheet(document.getElementById('oldName').value, document.getElementById('newName').value);
    });
  </script>
</body>
</html>
