<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
    select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .btn { background-color: #d23f31; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn:hover { background-color: #b3362a; }
    #status { margin-top: 12px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <form id="mainForm">
    <div class="form-group">
      <label for="sheetName">Select Sheet to DELETE:</label>
      <select id="sheetName" required>
        <option value="" disabled selected>Loading...</option>
      </select>
    </div>
    <button type="submit" class="btn" id="submitBtn">Delete Permanently</button>
    <div id="status"></div>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      google.script.run.withSuccessHandler(function(sheets) {
        var select = document.getElementById('sheetName');
        select.innerHTML = '';
        sheets.forEach(function(s) {
          var opt = document.createElement('option'); opt.value = s; opt.text = s; select.appendChild(opt);
        });
      }).getAssessmentSheets();
    });

    document.getElementById('mainForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      if(!confirm("WARNING!\nThis action will delete the sheet and all associated topics and questions.\n\nAre you sure you want to continue?")) {
        return;
      }

      var btn = document.getElementById('submitBtn');
      var status = document.getElementById('status');
      btn.disabled = true; status.textContent = 'Deleting...';
      
      google.script.run
        .withSuccessHandler(function(msg) {
          status.style.color = '#0f9d58'; status.textContent = msg;
          setTimeout(function() { google.script.host.close(); }, 2000);
        })
        .withFailureHandler(function(err) {
          status.style.color = 'red'; status.textContent = err.message; btn.disabled = false;
        })
        .deleteAssessmentSheet(document.getElementById('sheetName').value);
    });
  </script>
</body>
</html>
